name: StereoGuide APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Proje ZIP dosyasini ac
        run: |
          unzip -o StereoGuide-Android-project-v0.5.0-auto-align-fast.zip

      - name: GuideOverlayView hatasini duzelt
        run: |
          GUIDE_FILE="$(find StereoGuide -name GuideOverlayView.kt -print -quit)"
          test -n "$GUIDE_FILE"
          sed -i '77s/\bcx\b/(width \/ 2f)/g' "$GUIDE_FILE"

      - name: Java ve Kotlin hedeflerini 17 yap
        run: |
          sed -i '/    kotlinOptions {/i\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }\
          ' StereoGuide/app/build.gradle.kts

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK olustur
        working-directory: StereoGuide
        run: gradle assembleDebug

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: StereoGuide-v0.5.0-APK
          path: StereoGuide/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
