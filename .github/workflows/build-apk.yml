name: StereoGuide Inspect XML

on:
  push:
    branches:
      - agent/stereoguide-macro-zoom

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projeyi ac
        run: unzip -o StereoGuide-Android-project-v0.7.0-burst-selection.zip
      - name: XML kaynaklarini yazdir
        run: |
          echo '=== activity_main.xml ==='
          cat StereoGuide/app/src/main/res/layout/activity_main.xml
          echo '=== strings.xml ==='
          cat StereoGuide/app/src/main/res/values/strings.xml
          echo '=== app build.gradle.kts ==='
          cat StereoGuide/app/build.gradle.kts
