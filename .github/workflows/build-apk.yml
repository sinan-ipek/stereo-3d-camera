name: StereoGuide APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Düzeltilmiş v0.6.0 proje paketini aç
        run: unzip -o StereoGuide-Android-project-v0.6.0-fixed.zip

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK oluştur
        working-directory: StereoGuide
        run: gradle --no-daemon assembleDebug

      - name: APK dosyasını yayımla
        uses: actions/upload-artifact@v4
        with:
          name: StereoGuide-v0.6.0-APK
          path: StereoGuide/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
