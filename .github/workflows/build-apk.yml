name: StereoGuide Hiper Rename

on:
  push:
    branches:
      - agent/stereoguide-macro-zoom
    paths:
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: v0.8.0 proje paketini ac
        run: unzip -o StereoGuide-Android-project-v0.8.0-macro-zoom.zip

      - name: Makro adini Hiper yap
        run: |
          sed -i 's/<string name="macro_12cm">Makro 12 cm<\/string>/<string name="macro_12cm">Hiper<\/string>/' StereoGuide/app/src/main/res/values/strings.xml
          sed -i 's/versionCode = 8/versionCode = 9/' StereoGuide/app/build.gradle.kts
          sed -i 's/versionName = "0.8.0"/versionName = "0.8.1"/' StereoGuide/app/build.gradle.kts

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK olustur
        working-directory: StereoGuide
        run: gradle --no-daemon assembleDebug

      - name: v0.8.1 proje paketini olustur
        run: |
          rm -f StereoGuide-Android-project-v0.8.1-hiper.zip
          zip -qr StereoGuide-Android-project-v0.8.1-hiper.zip StereoGuide

      - name: Yeni proje paketini dala kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StereoGuide-Android-project-v0.8.1-hiper.zip
          git commit -m "add StereoGuide v0.8.1 Hiper label" || exit 0
          git push

      - name: APK ve proje paketini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: StereoGuide-v0.8.1-Hiper
          path: |
            StereoGuide/app/build/outputs/apk/debug/app-debug.apk
            StereoGuide-Android-project-v0.8.1-hiper.zip
          if-no-files-found: error
